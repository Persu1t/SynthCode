[project]
name = "synthcode-ai"
version = "0.1.0"
description = "SynthCode AI service: completions, chat and code understanding (health check only for now)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
