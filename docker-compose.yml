# Runs the whole stack: docker compose up --build
#   frontend  http://localhost:8080
#   backend   http://localhost:4000/api/health
#   ai        http://localhost:8000/health
services:
  backend:
    build: ./backend
    # DB_URL and DB_NAME come from backend/.env. Inside a container, "localhost" is the
    # container itself, so use an Atlas URL (or a host the container can reach).
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "4000:4000"

  ai:
    build: ./ai
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
